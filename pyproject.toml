[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capoeira-code"
version = "6.0.0"
description = "Agente CLI para manutenção, refatoração e criação de artefatos em sistemas legados (backend CapoeiraHost)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "prompt_toolkit>=3.0",
    "rich>=13.7",
    "tree-sitter>=0.24",
    "tree-sitter-php>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
]

[project.scripts]
capoeira = "cli.entry:main"
capoeira-code = "cli.entry:main"

[tool.setuptools.packages.find]
include = ["cli*"]